name: Compilar APK para Android
on:
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar carpeta www
        run: |
          mkdir www
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
          cp -r vendor www/vendor
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Compilar APK de prueba
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-de-lectura-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
